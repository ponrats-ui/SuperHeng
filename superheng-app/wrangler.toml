# Cloudflare Pages configuration for the SuperHeng web frontend.
#
# `wrangler pages deploy` and the Pages Git integration both read this file when
# it sits in the project's Root directory. In the Cloudflare dashboard that Root
# directory is set to `superheng-app` (the app is a subdirectory of the repo), so
# this file belongs here — at `superheng-app/wrangler.toml` — and NOT at the
# repository root.
#
# `name` MUST match the Pages project name. Rename one and you must rename the
# other, otherwise `wrangler pages deploy` creates or targets the wrong project.
name = "superheng"

# Directory produced by `npm run build` (`expo export -p web`). Relative to this
# file. That command writes one static HTML file per route, so every real route
# is served from its own file and no `_redirects` rule is needed for them.
#
# Unmatched paths behave differently, and the reason is worth knowing before
# debugging a phantom 404. Pages treats any project lacking a top-level
# `404.html` as a single-page app and serves the root document for a path that
# matches no asset:
#
#   "If your project does not include a top-level 404.html file, Pages assumes
#    that you are deploying a single-page application."
#   https://developers.cloudflare.com/pages/configuration/serving-pages/
#
# So `/does-not-exist` returns the root page, not a 404. That is Pages' built-in
# default: a `_redirects` file is not what enables it, and shipping a `404.html`
# in `dist/` is what disables it. See DEPLOY.md, "Known limitations".
pages_build_output_dir = "dist"

# Pins the Workers/Pages runtime behaviour used when Cloudflare evaluates this
# project. Bump deliberately, never automatically.
compatibility_date = "2026-10-13"

# Build-time variables.
#
# This table, not the dashboard, is what populates the build environment. With a
# wrangler.toml present in the build root, Cloudflare reads the Pages build
# configuration from it and reports exactly what it found in the build log:
#
#   Found wrangler.toml file. Reading build configuration...
#   pages_build_output_dir: dist
#   Build environment variables: (none found)
#
# A variable added in the dashboard (Settings > Variables and secrets) is of type
# Text or Secret - a *runtime* variable. Two production builds verified this: the
# dashboard variable was persisted, yet `npm run build` never saw it and the
# exported bundle shipped the `127.0.0.1:8000` fallback from src/lib/api.ts.
#
# Expo inlines every EXPO_PUBLIC_* value at build time, so the value must be
# readable by the build. Declaring it here also keeps it in version control,
# where a wrong URL is visible in review instead of hidden in a dashboard.
#
# It is a public endpoint and is embedded in client JavaScript either way - which
# is exactly why no secret belongs in this table.
[vars]
EXPO_PUBLIC_API_URL = "https://superheng-api.onrender.com"

# Accounts (premium subscriptions).
#
# Without these two the hosted build boots fine but cannot sign anyone in:
# `src/lib/supabase.ts` bakes both values in at build time and reports
# `isAuthConfigured = false` when they are missing, so the Premium panel told
# every visitor that accounts were not configured — while the same two values
# worked perfectly in every local build, because `.env` supplied them to Expo
# but nothing supplied them to the Pages build. That is the failure mode this
# table exists to prevent, and DEPLOY.md step 6 says the same thing.
#
# The anon key is **meant** to be public. Expo inlines it into the client bundle
# exactly like EXPO_PUBLIC_API_URL, and row-level security
# (`backend/schema_profiles.sql`) is what protects the data behind it — see
# `.env.example`, which says this at length.
#
# The `service_role` key must NEVER appear here: it bypasses RLS, and the whole
# design of the premium gate is that the API reads an entitlement through RLS
# with the *user's own* token and so cannot be tricked into another user's row.
# If this file is ever edited to hold one, that guarantee is gone.
#
# There is deliberately no EXPO_PUBLIC_STRIPE_* variable. The app redirects to
# Stripe's hosted Checkout and never loads Stripe.js, so no key belongs in the
# client at all — `.env.example` explains why at length.
EXPO_PUBLIC_SUPABASE_URL = "https://eiukzhtbslgoennqpvix.supabase.co"
